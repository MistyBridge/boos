<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="boos-frontend-version" content="1.1.0">
    <!-- maximum-scale=1 stops iOS Safari from auto-zooming the page
         when the user taps a sub-16px input. xterm's helper textarea
         inherits the terminal's own font size (11px on phones); if we
         instead bumped it to 16px via CSS, xterm would measure the
         cell off the inflated textarea and render every glyph ~50%
         oversized. Locking page zoom here lets us leave the textarea
         alone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!-- Bleeds the cream surface into the Edge/Chrome --app= title bar
         so it visually disappears against the body. The browser does
         honor this in standalone app windows. -->
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="color-scheme" content="light" />
    <title>BOOS · Claude Code 会话管理器</title>
    <!-- All asset paths are RELATIVE so the same index.html works when
         served from localhost:7777/ (backend bundle) AND from
         https://MistyBridge.github.io/boos/v1/ (GH Pages hosted). -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Point at the ROOT manifest (/boos/manifest.webmanifest) so the
         installable PWA is scoped to /boos/, covering every per-version
         subdir. If we shipped a per-version manifest the browser would
         scope the PWA to /boos/X.Y.Z/ — then the version-guard's
         redirect to ../ on backend upgrade would fall out of scope and
         the OS would re-show an address bar. -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <!-- Apply theme (accent + light/dark) BEFORE stylesheets/paint to
         avoid a flash of the default light tokens.css bg. Mirrors
         applyTheme()/applyAccentCssVars() in state.js — keep the two in
         sync. Resolves 'system' against the OS, sets data-theme so the
         [data-theme="dark"] CSS overrides apply from the first frame, and
         derives the accent-tinted palette for the chosen ground. -->
    <script>
      (function () {
        try {
          var hex = localStorage.getItem('boos.accent');
          if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) hex = '#2f6fa3';
          var mode = localStorage.getItem('boos.theme');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
          var dark = mode === 'dark' || (mode === 'system'
            && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

          var n = parseInt(hex.slice(1), 16);
          var A = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
          var toHex = function (v) { v = Math.max(0, Math.min(255, Math.round(v))); var s = v.toString(16); return s.length < 2 ? '0' + s : s; };
          var rgb = function (c) { return '#' + toHex(c.r) + toHex(c.g) + toHex(c.b); };
          var lerp = function (c1, c2, t) { return { r: c1.r + (c2.r - c1.r) * t, g: c1.g + (c2.g - c1.g) * t, b: c1.b + (c2.b - c1.b) * t }; };
          var WHITE = { r: 255, g: 255, b: 255 }, BLACK = { r: 0, g: 0, b: 0 };
          var DARK_BASE = { r: 0x18, g: 0x16, b: 0x12 }, LIGHT_INK = { r: 0xec, g: 0xe7, b: 0xda };

          var root = document.documentElement.style;
          var set = function (o) { for (var k in o) root.setProperty(k, o[k]); };
          var vars;
          if (dark) {
            var bg = lerp(DARK_BASE, A, 0.06);
            var lift = function (t) { return rgb(lerp(bg, LIGHT_INK, t)); };
            vars = {
              '--accent': hex,
              '--accent-deep': rgb(lerp(A, LIGHT_INK, 0.18)),
              '--accent-soft': 'rgba(' + A.r + ',' + A.g + ',' + A.b + ',0.18)',
              '--accent-softer': 'rgba(' + A.r + ',' + A.g + ',' + A.b + ',0.07)',
              '--bg': rgb(bg), '--bg-elev': lift(0.05), '--sidebar-bg': rgb(bg),
              '--sidebar-hover': lift(0.09), '--sidebar-active': lift(0.15),
              '--border': lift(0.14), '--border-soft': lift(0.09), '--border-strong': lift(0.24),
              '--ui-bg': lift(0.05), '--ui-border': lift(0.16), '--ui-border-soft': lift(0.10),
              '--ink': rgb(LIGHT_INK),
              '--ink-mid': rgb(lerp(LIGHT_INK, DARK_BASE, 0.28)),
              '--ink-muted': rgb(lerp(LIGHT_INK, DARK_BASE, 0.45)),
              '--ink-faint': rgb(lerp(LIGHT_INK, DARK_BASE, 0.60)),
            };
          } else {
            var mix = function (t) { return rgb(lerp(WHITE, A, t)); };
            vars = {
              '--accent': hex,
              '--accent-deep': rgb(lerp(A, BLACK, 0.2)),
              '--accent-soft': 'rgba(' + A.r + ',' + A.g + ',' + A.b + ',0.10)',
              '--accent-softer': 'rgba(' + A.r + ',' + A.g + ',' + A.b + ',0.04)',
              '--bg': mix(0.04), '--bg-elev': '#ffffff', '--sidebar-bg': mix(0.04),
              '--sidebar-hover': mix(0.10), '--sidebar-active': mix(0.15),
              '--border': mix(0.15), '--border-soft': mix(0.12), '--border-strong': mix(0.25),
              '--ui-bg': mix(0.10), '--ui-border': '#d8d4c6', '--ui-border-soft': '#e6e2d4',
              '--ink': '#1a1815', '--ink-mid': '#534e44', '--ink-muted': '#8a8475', '--ink-faint': '#b5af9d',
            };
          }
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          set(vars);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', vars['--bg']);
        } catch (_) {}
      })();
    </script>
    <!-- Google Fonts removed — unreachable from this network.
         CSS font stacks fall through to system fonts:
           body:  ui-sans-serif, system-ui, sans-serif
           mono:  Cascadia Mono, Consolas, monospace -->
    <link rel="stylesheet" href="./css/tokens.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/base.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/layout.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/sidebar.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/cards.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/tables.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/forms.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/widgets.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/feedback.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/modal.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/loadsession.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/terminals.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/wco.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/workspace.css?v=1.1.0" />
    <link rel="stylesheet" href="./css/responsive.css?v=1.1.0" />
    <!-- Loaded last so its [data-theme="dark"] rules win the cascade. -->
    <link rel="stylesheet" href="./css/dark.css?v=1.1.0" />

    <script type="importmap">
      {
        "imports": {
          "preact":             "/node_modules/preact/dist/preact.module.js",
          "preact/hooks":       "/node_modules/preact/hooks/dist/hooks.module.js",
          "preact/compat":      "/node_modules/preact/compat/dist/compat.module.js",
          "@preact/signals":    "/node_modules/@preact/signals/dist/signals.module.js",
          "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.module.js",
          "htm":                "/node_modules/htm/dist/htm.module.js",
          "@xterm/xterm":       "/vendor/xterm.js",
          "@xterm/addon-fit":   "/vendor/xterm-fit.js",
          "@xterm/addon-web-links": "/vendor/xterm-web-links.js",
          "@xterm/addon-clipboard": "/vendor/xterm-clipboard.js",
          "@xterm/addon-serialize": "/vendor/xterm-serialize.js"
        }
      }
    </script>
    <link rel="stylesheet" href="/vendor/xterm.css" />
  </head>
  <body>
    <div id="app">
      <div style="padding:40px;font-family:sans-serif;color:#b3614a;text-align:center">
        <p style="font-size:24px;font-weight:bold;margin:0 0 8px">🔌 BOOS 加载中...</p>
        <p id="boos-diag" style="font-size:13px;color:#8a8475;margin:0">如果此文字可见，HTML/CSS 正常 — JS 初始化失败</p>
      </div>
    </div>
    <script>
      // Global error display: show JS errors on the page so we can see
      // what's failing without needing to open DevTools.
      (function() {
        var diagEl = document.getElementById('boos-diag');
        function showError(msg) {
          if (diagEl) { diagEl.textContent = msg; diagEl.style.color = '#b73f3f'; }
          console.error('[boos:diag]', msg);
        }
        // addEventListener('error') catches module load failures (static import)
        window.addEventListener('error', function(evt) {
          var src = (evt.target && evt.target.src) || evt.filename || '';
          showError('❌ ' + evt.message + ' [' + src.split('/').pop() + ':' + evt.lineno + ']');
        }, true); // capturing phase to catch errors from <script type="module">
        window.addEventListener('unhandledrejection', function(evt) {
          showError('❌ Promise: ' + (evt.reason ? (evt.reason.message || String(evt.reason)) : 'unknown'));
        });
      })();
    </script>
    <script>
      // Self-healing: unregister ALL service workers, then reload.
      // Fixes stale-cache blank-page after frontend dependency changes.
      (function() {
        if ('serviceWorker' in navigator && !location.hash.includes('boos-sw-cleaned')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (regs.length) {
              console.log('[boos:diag] Cleaning ' + regs.length + ' stale service worker(s)...');
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }
          }).then(function() {
            if (sessionStorage.getItem('boos-sw-cleaned')) return;
            sessionStorage.setItem('boos-sw-cleaned', '1');
            console.log('[boos:diag] SW cleaned, reloading...');
            location.reload();
          }).catch(function(){});
        }
      })();
    </script>
    <script>
      // Diagnostic: check if page basics work
      window.__BOOS_DIAG = { html: true, time: Date.now() };
      console.log('[boos:diag] HTML loaded, importmap:', !!document.querySelector('script[type="importmap"]'));
      // Check if Service Worker is active
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          console.log('[boos:diag] SW registrations:', regs.length);
          regs.forEach(function(r, i) {
            console.log('[boos:diag] SW#' + i, 'scope=' + r.scope, 'active=' + !!r.active, r.active ? 'state=' + r.active.state : '');
          });
        });
      }
    </script>
    <script type="module" src="./js/main.js?v=1.1.0.20260726"></script>
    <script>
      // Dev hot-reload — only active when the page itself loads from a
      // local backend (the /api/dev/ping endpoint exists only on a dev
      // checkout). On the GH Pages copy this skips entirely.
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        fetch('/api/dev/ping', { cache: 'no-store' }).then((r) => {
          if (!r.ok) return;
          const es = new EventSource('/api/dev/reload');
          es.addEventListener('reload', () => location.reload());
        }).catch(() => {});
      }
    </script>
  </body>
</html>
