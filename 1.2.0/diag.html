<!doctype html>
<html><head><meta charset="utf-8"><title>BOOS Diag</title>
<script type="importmap">{"imports":{"preact":"/node_modules/preact/dist/preact.module.js","preact/hooks":"/node_modules/preact/hooks/dist/hooks.module.js","@preact/signals":"/node_modules/@preact/signals/dist/signals.module.js","htm":"/node_modules/htm/dist/htm.module.js","@xterm/xterm":"/vendor/xterm.js"}}</script>
<style>body{font-family:sans-serif;padding:20px;background:#faf9f5;color:#1a1815}.ok{color:#4a8a4a}.fail{color:#b73f3f}.pending{color:#8a8475}</style></head><body>
<h2>BOOS 模块加载诊断</h2>
<div id="results"></div>
<script type="module">
const r = document.getElementById('results');
function log(msg, cls) { r.innerHTML += '<p class="'+cls+'">'+msg+'</p>'; console.log(msg); }
log('开始诊断...', 'pending');

try {
  // Test 1: preact
  const p1 = await import('preact');
  log('✅ preact: ' + Object.keys(p1).join(', '), 'ok');

  // Test 2: preact/hooks
  const p2 = await import('preact/hooks');
  log('✅ preact/hooks: ' + Object.keys(p2).join(', '), 'ok');

  // Test 3: @preact/signals
  const p3 = await import('@preact/signals');
  log('✅ @preact/signals: ' + Object.keys(p3).join(', '), 'ok');

  // Test 4: htm
  const p4 = await import('htm');
  log('✅ htm: ' + (typeof p4.html) + ', ' + Object.keys(p4).join(', '), 'ok');

  // Test 5: xterm
  const p5 = await import('@xterm/xterm');
  log('✅ @xterm/xterm: Terminal=' + (typeof p5.Terminal), 'ok');

  // Test 6: render something
  p1.render(p1.h('div', null, '✅ Preact 渲染成功!'), document.getElementById('render-test'));

  log('🎉 全部测试通过！核心模块链正常。问题在业务代码。', 'ok');
} catch(e) {
  log('❌ 失败: ' + e.message + ' (stack: ' + (e.stack||'').split('\\n').slice(0,3).join(' ← ') + ')', 'fail');
}
</script>
<div id="render-test"></div>
<hr><p>📋 <b>下一步:</b> 如果以上全部 ✅，回到主页面看错误提示。</p>
</body></html>
